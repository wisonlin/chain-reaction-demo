</style><main><div class="badge">原生 iOS · 开发预览 8.4.0（23）</div><h1>六位旅人，十八套衣装。</h1><p class="muted">六个职业，六种主元素。每人三套衣装：默认装与两套职业主题装。</p><p class="notice" id="release-status">六角色版本已实现，正在原生验收；尚未提交本轮 TestFlight。</p><nav aria-label="选择旅人" id="heroes"></nav><section class="hero" id="hero"><h2 id="name"></h2><p id="role"></p><p class="skills" id="attack"></p><img class="portrait" id="portrait" alt=""><div class="skins" id="skins" aria-label="选择衣装"></div><p class="caption" id="costume"></p></section><p class="caption">衣装只改变外观。这里展示本次 App 实际打包的全部衣装，不代表新存档已全部获得。</p><h2>这次同时调整</h2><p>战斗右上角有独立的「暂停」按钮，可以继续或确认退出。命中、护甲击破和敌人爆炸加入短促音效及变体。</p><a class="link" href="native-831-impact.html">试听打击音效对比</a><p class="footer">全离线单机，竖屏单指拖动与自动射击。本页是原生版本的衣装与界面预览；既有网页游戏保持旧快照。立绘由本次 App 打包资源导出；本页的衣装展示不能代替原生完整验收。</p></main><script>
const heroes=[{"id": "ember", "name": "岚珀", "profession": "火焰法师", "element": "fire", "role": "扇形焰星 · 广域压制", "elementName": "火", "color": "#ed9e73", "outfits": [{"title": "赤焰护航", "profession": "护航员", "image": "native-84-ember-0.webp"}, {"title": "白焰医护", "profession": "战地护士", "image": "native-84-ember-1.webp"}, {"title": "云港学苑", "profession": "成年学院研修生", "image": "native-84-ember-2.webp"}]}, {"id": "lune", "name": "霁弦", "profession": "雷矛使者", "element": "lightning", "role": "双列雷矛 · 对齐贯穿", "elementName": "雷", "color": "#be9ce8", "outfits": [{"title": "逐电巡航", "profession": "雷霆法师", "image": "native-84-lune-0.webp"}, {"title": "星理研习", "profession": "学院研究员", "image": "native-84-lune-1.webp"}, {"title": "雷音舞台", "profession": "音乐指挥", "image": "native-84-lune-2.webp"}]}, {"id": "nerine", "name": "澜歌", "profession": "潮汐术士", "element": "water", "role": "追踪水环 · 移动输出", "elementName": "水", "color": "#79cce1", "outfits": [{"title": "潮汐航者", "profession": "海流歌者", "image": "native-84-nerine-0.webp"}, {"title": "泡沫茶事", "profession": "咖啡师", "image": "native-84-nerine-1.webp"}, {"title": "深海领航", "profession": "航海军官", "image": "native-84-nerine-2.webp"}]}, {"id": "sol", "name": "绯穗", "profession": "风舞剑士", "element": "wind", "role": "摆动花刃 · 横扫航路", "elementName": "风", "color": "#b5d5a5", "outfits": [{"title": "晨花舞者", "profession": "花舞剑士", "image": "native-84-sol-0.webp"}, {"title": "玫瑰烘焙", "profession": "甜点师", "image": "native-84-sol-1.webp"}, {"title": "曙色快门", "profession": "旅行摄影师", "image": "native-84-sol-2.webp"}]}, {"id": "vesper", "name": "夜珩", "profession": "寒晶守卫", "element": "ice", "role": "交叉冰刃 · 冻结牵制", "elementName": "冰", "color": "#b5cde6", "outfits": [{"title": "寒星守夜", "profession": "星刃守卫", "image": "native-84-vesper-0.webp"}, {"title": "月台特勤", "profession": "巡警", "image": "native-84-vesper-1.webp"}, {"title": "极夜医馆", "profession": "急救医生", "image": "native-84-vesper-2.webp"}]}, {"id": "aster", "name": "青翎", "profession": "森林德鲁伊", "element": "grass", "role": "螺旋草叶 · 持续侵蚀", "elementName": "草", "color": "#b8cd8e", "outfits": [{"title": "云种园丁", "profession": "自然法师", "image": "native-84-aster-0.webp"}, {"title": "春庭花店", "profession": "花艺师", "image": "native-84-aster-1.webp"}, {"title": "碧叶书馆", "profession": "图书管理员", "image": "native-84-aster-2.webp"}]}];let current=0,skin=0;const el=id=>document.getElementById(id);const nav=el('heroes');heroes.forEach((h,i)=>{const b=document.createElement('button');b.textContent=h.name+' · '+h.elementName;b.dataset.hero=h.id;b.onclick=()=>{current=i;skin=0;show()};nav.append(b)});function show(){const h=heroes[current];el('name').textContent=h.name;el('role').textContent=h.elementName+' · '+h.profession;el('attack').textContent=h.role;el('hero').style.setProperty('--glow',h.color+'55');[...nav.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===current));el('skins').replaceChildren();h.outfits.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.title;const label=document.createElement('span');label.textContent=i===0?'默认装':o.profession;b.append(label);b.dataset.skin=i;b.setAttribute('aria-pressed',i===skin);b.onclick=()=>{skin=i;show()};el('skins').append(b)});const o=h.outfits[skin];el('portrait').src=o.image;el('portrait').alt=h.name+' · '+o.title+' 全身立绘';el('costume').textContent=o.title+' · '+o.profession;}show();

<body>
  <main class="game-app">
    <header class="app-header">
      <div class="brand"><span class="brand-mark">↗</span><div>反击弹幕<small>V0.3 / 挑战版</small></div></div>
      <div class="header-actions"><button id="sound-button" class="icon-button" aria-label="关闭音效" aria-pressed="true">♪</button><button id="pause-button" class="icon-button" aria-label="暂停游戏" disabled>Ⅱ</button></div>
    </header>
    <section class="hud" aria-label="游戏状态">
      <div class="hud-score"><span>得分</span><strong id="score">000000</strong></div>
      <div class="hud-chain"><span>连击</span><strong id="combo">×1<span>连锁就绪</span></strong></div>
      <div class="hud-time"><span>倒计时</span><strong id="time">60<span>s</span></strong></div>
      <div class="hud-life"><span>护盾</span><div id="health" aria-label="3 格护盾"><i></i><i></i><i></i></div></div>
    </section>
    <section class="game-frame" aria-label="竖屏游戏战场">
      <div class="stage" id="stage">
        <canvas id="game" width="600" height="800" tabindex="0" aria-label="反击弹幕。拖动摇杆或战场移动，自动射击，点击冲刺按钮。"></canvas>
        <div class="stage-vignette"></div>
        <div class="arena-heading"><span id="arena-label">反击准备就绪</span><span>MOBILE / 01</span></div>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <span class="overlay-kicker" id="overlay-kicker">挑战版 · 突破包围</span>
            <h1 id="overlay-title">连锁<span class="title-second">反应.</span></h1>
            <p id="overlay-description">射爆粉色敌弹<br>引发一整片绿色连锁爆炸</p>
            <div class="how-to" id="how-to"><span>◎<small>拖动移动</small></span><span>⌖<small>自动射击</small></span><span>↗<small>点击冲刺</small></span></div>
            <div class="result-stats" id="result-stats" hidden></div>
            <button class="primary-button" id="start-button"><span>开始反击</span><span>↗</span></button>
            <button class="secondary-button" id="retry-button" hidden>重新开始</button>
            <p class="overlay-hint" id="overlay-hint">60 秒一局 · 小心侧翼突袭</p>
            <div class="personal-best">挑战版最高 <strong id="personal-best">000000</strong></div>
          </div>
        </div>
        <div class="toast" id="toast" aria-live="polite"></div>
        <div class="drag-indicator" id="drag-indicator" hidden><i></i></div>
      </div>
      <div class="arena-bottom"><span><b id="wave">01</b><span id="wave-name">初次接触</span></span><span id="chain-record">最大连锁 0</span></div>
      <div class="time-track"><i id="time-fill"></i></div>
    </section>
    <section class="touch-panel" id="touch-controls" aria-label="触控操作区">
      <div class="move-control"><div class="touch-pad" id="move-pad" role="group" aria-label="拖动移动摇杆"><span class="pad-cross"></span><i></i></div><span class="control-label">拖动移动</span></div>
      <div class="auto-status"><span class="auto-dot"></span>自动射击<small>优先引爆敌弹</small><div class="dash-meter"><i id="dash-fill"></i></div><span id="dash-label">冲刺已就绪</span></div>
      <div class="dash-control"><button id="touch-dash" aria-label="冲刺，短暂无敌" disabled><span class="dash-arrow">↗</span><span id="dash-button-label">冲刺</span></button><span class="control-label">短暂无敌</span></div>
    </section>
    <footer id="field-note">橙色追击者会包围你 · 用冲刺拉开距离</footer>
  </main>
  <script type="module">const WORLD = { width: 1100, height: 700, duration: 60 };
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const TAU = Math.PI * 2;
const PRESSURE = [
  { spawn: 1.15, chase: 124, bullet: 115, volley: 1.65, flank: 2 },
  { spawn: 1, chase: 138, bullet: 130, volley: 1.45, flank: 2 },
  { spawn: .8, chase: 152, bullet: 146, volley: 1.25, flank: 3 },
  { spawn: .62, chase: 166, bullet: 164, volley: 1.08, flank: 3 }
];

class Game {
  constructor(random = Math.random, world = WORLD) {
    this.random = random;
    this.world = { ...WORLD, ...world };
    this.mobile = this.world.width < 900;
    this.reset();
    this.state = 'ready';
  }
  reset() {
    this.state = 'playing';
    const { width, height } = this.world;
    this.player = { x: width / 2, y: this.mobile ? height * .6 : 380, r: 12, vx: 0, vy: 0, angle: -Math.PI / 2, hp: 3, invincible: 1.5, dash: 0, cooldown: 0, dashX: 0, dashY: -1 };
    this.enemies = [];
    this.bullets = [];
    this.shots = [];
    this.blasts = [];
    this.particles = [];
    this.labels = [];
    this.events = [];
    this.elapsed = 0;
    this.score = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.bestChain = 0;
    this.kills = 0;
    this.detonations = 0;
    this.dashes = 0;
    this.wave = 1;
    this.spawnTimer = this.mobile ? 1.15 : 1.8;
    this.flankTimer = 6;
    this.shootTimer = 0;
    this.hitstop = 0;
    this.shake = 0;
    this.chains = new Map();
    this.nextChain = 1;
    this.lastChainNotice = 0;
    // A forgiving opening: three stationary guns and a visible cluster to discover the hook.
    for (const [x, y] of [[width * .25, height * .22], [width * .75, height * .22], [width / 2, height * .12]]) this.spawnEnemy('shooter', x, y, 1.6);
    for (let i = 0; i < 5; i++) {
      this.bullets.push({ x: width / 2 - 60 + i * 30, y: height * .35 - Math.sin(i * .8) * 25, vx: 0, vy: 21, r: 7, life: 7, dead: false, prime: 0 });
    }
  }
  get multiplier() { return Math.min(8, 1 + Math.floor(this.combo / 5)); }
  get remaining() { return Math.max(0, this.world.duration - this.elapsed); }
  get pressure() { return PRESSURE[Math.min(3, this.wave - 1)]; }
  getAutoTarget() {
    const candidates = this.bullets.filter(b => !b.dead && !b.prime && distance(b, this.player) < 420)
      .sort((a, b) => distance(a, this.player) - distance(b, this.player)).slice(0, 32);
    // Help against imminent contact, but simultaneous threats still need player movement.
    if (this.mobile && !candidates.some(b => distance(b, this.player) < 65)) {
      const pursuer = this.enemies.filter(e => !e.dead && e.warmup <= 0 && e.type === 'chaser' && distance(e, this.player) < 125)
        .sort((a, b) => distance(a, this.player) - distance(b, this.player))[0];
      if (pursuer) return pursuer;
    }
    let target = null, best = -Infinity;
    for (const b of candidates) {
      const d = distance(b, this.player);
      const neighbors = candidates.reduce((n, other) => n + Number(distance(b, other) < 85), 0);
      const rating = neighbors * 22 - d + (d < 95 ? 150 : 0);
      if (rating > best) { best = rating; target = b; }
    }
    if (target) return target;
    return this.enemies.filter(e => !e.dead && e.warmup <= 0)
      .sort((a, b) => distance(a, this.player) - distance(b, this.player))[0] || null;
  }
  event(type, data = {}) { this.events.push({ type, ...data }); }
  addScore(value) { this.score += value * this.multiplier; }
  particle(x, y, color, n = 10, speed = 160) {
    for (let i = 0; i < n; i++) {
      const a = this.random() * TAU, s = speed * (.25 + this.random());
      this.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .25 + this.random() * .35, maxLife: .6, color, size: 1 + this.random() * 2.5 });
    }
    if (this.particles.length > 550) this.particles.splice(0, this.particles.length - 550);
  }
  spawnEnemy(type, x, y, delay = .75) {
    const { width, height } = this.world;
    if (x === undefined) {
      const edge = Math.floor(this.random() * 4);
      x = edge === 0 ? 38 : edge === 1 ? width - 38 : 70 + this.random() * (width - 140);
      y = edge === 2 ? 38 : edge === 3 ? height - 38 : 60 + this.random() * (height - 120);
      if (Math.hypot(x - this.player.x, y - this.player.y) < (this.mobile ? 180 : 230)) {
        x = this.player.x < width / 2 ? width - 60 : 60;
        y = this.player.y < height / 2 ? height - 70 : 70;
      }
    }
    // Explicit flank positions have the same spawn safety as random edge positions.
    if (this.mobile && delay > 0 && Math.hypot(x - this.player.x, y - this.player.y) < 180) {
      y = this.player.y < height / 2 ? height - 45 : 45;
    }
    const hp = this.mobile ? { spinner: 7, shooter: 4, chaser: 5 }[type] : type === 'spinner' ? 5 : type === 'shooter' ? 3 : 2;
    this.enemies.push({ type, x, y, r: type === 'spinner' ? 22 : type === 'shooter' ? 18 : 14, hp, timer: (this.mobile ? .6 : .8) + this.random() * .5, angle: this.random() * TAU, warmup: delay, flash: 0, dead: false });
  }
  spawnFlank() {
    const count = Math.min(this.pressure.flank, 24 - this.enemies.length);
    if (count <= 0) return;
    const offset = Math.floor(this.random() * 4) * Math.PI / 2;
    for (let i = 0; i < count; i++) {
      const a = offset + i * TAU / count;
      this.spawnEnemy('chaser', this.world.width / 2 + Math.cos(a) * (this.world.width / 2 - 38), this.world.height / 2 + Math.sin(a) * (this.world.height / 2 - 38), 1.1);
    }
    this.event('flank', { count });
  }
  emitBullet(x, y, angle, speed = 105) {
    this.bullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 6, life: 10, dead: false, prime: 0 });
  }
  startDash(input) {

  for (const e of game.events) {
    if (e.type === 'shoot') tone(640, .055, 'triangle', .12, 210);
    if (e.type === 'dash') tone(180, .13, 'sawtooth', .1, 70);
    if (e.type === 'chain' && visualTime - lastSound > .035) { tone(220 + Math.min(e.size, 20) * 35, .15, 'sine', .42, 110 + Math.min(e.size, 20) * 30); lastSound = visualTime; }
    if (e.type === 'kill') tone(110, .1, 'triangle', .22, 40);
    if (e.type === 'hurt') { tone(95, .25, 'sawtooth', .5, 30); toast(`护盾受损 · 剩余 ${game.player.hp} 格`); }
    if (e.type === 'wave') { toast(['', '迎击', '两面夹击 · 敌人加速', '高压弹幕 · 保持移动', '最后 15 秒 · 极限反击'][e.wave]); tone(440, .2, 'sine', .2, 550); }
    if (e.type === 'flank') { toast(`侧翼突袭 · ${e.count} 个追击者即将入场`); tone(280, .16, 'triangle', .24, 420); }
    if (e.type === 'chainNotice') { $('field-note').textContent = `${e.size} 发敌弹，连成了一次反击。继续寻找密集弹幕，把倍率推到 ×8。`; }
    if (e.type === 'over') showResult(e.won);
  }
  game.events.length = 0;
}
function updateHUD() {
  $('score').textContent = formatScore(game.score);
  $('time').innerHTML = `${Math.ceil(game.remaining).toString().padStart(2, '0')}<span>s</span>`;
  $('time').classList.toggle('low-time', game.remaining <= 10);
  $('combo').innerHTML = `×${game.multiplier}<span>${game.combo ? `${game.combo} 连击` : '连锁就绪'}</span>`;
  [...$('health').children].forEach((el, i) => el.classList.toggle('empty', i >= game.player.hp));
  $('health').setAttribute('aria-label', `${game.player.hp} 格护盾`);
  $('dash-fill').style.width = `${(1 - game.player.cooldown / 1.35) * 100}%`;
  $('dash-label').textContent = game.player.cooldown > 0 ? '冲刺充能中' : '冲刺已就绪';
  $('dash-button-label').textContent = game.player.cooldown > 0 ? `${game.player.cooldown.toFixed(1)}s` : '冲刺';
  $('touch-dash').disabled = game.state !== 'playing' || game.player.cooldown > 0;
  $('wave').textContent = String(game.wave).padStart(2, '0');
  $('wave-name').textContent = waveNames[game.wave - 1];
  $('chain-record').textContent = `最大连锁 ${game.bestChain}`;
  $('time-fill').style.width = `${game.remaining / 60 * 100}%`;
}

function resize() {
  const box = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(box.width * dpr); canvas.height = Math.round(box.height * dpr);
  const scale = Math.min(box.width / arena.width, box.height / arena.height);
  view = { width: box.width, height: box.height, scale, x: (box.width - arena.width * scale) / 2, y: (box.height - arena.height * scale) / 2, dpr };
}
new ResizeObserver(resize).observe($('stage'));
resize();
function circle(x, y, r, color, fill = true, lineWidth = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = color; ctx.fill(); } else { ctx.strokeStyle = color; ctx.lineWidth = lineWidth; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, width = 1) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
}
function polygon(x, y, radius, sides, angle, stroke, fill = '#1b251d', width = 2) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) { const a = angle + i / sides * Math.PI * 2; const px = x + Math.cos(a) * radius, py = y + Math.sin(a) * radius; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke();
}
function drawBackground(time) {
  const w = arena.width, h = arena.height, cx = w / 2, cy = h / 2;
  ctx.fillStyle = '#0f180f'; ctx.fillRect(0, 0, w, h);
  const glow = ctx.createRadialGradient(cx, cy, 30, cx, cy, Math.max(w, h) * .6);
  glow.addColorStop(0, '#1d2b1844'); glow.addColorStop(1, '#0c130c00'); ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#9fce7716'; ctx.lineWidth = .7; ctx.beginPath();
  for (let x = 0; x <= w; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = 0; y <= h; y += 40) { ctx.moveTo(0, y); ctx.lineTo(w, y); } ctx.stroke();
  ctx.fillStyle = '#82996635';
  for (let x = 40; x < w; x += 80) for (let y = 40; y < h; y += 80) ctx.fillRect(x - 1, y - 1, 2, 2);
  circle(cx, cy, 180, '#819c5718', false); circle(cx, cy, 90, '#819c5718', false);
  line(cx-12,cy,cx+12,cy,'#819c5733'); line(cx,cy-12,cx,cy+12,'#819c5733');
  ctx.strokeStyle = '#7a98542a'; ctx.lineWidth = 1; ctx.strokeRect(10, 10, w-20, h-20);
  for (const [x,y,sx,sy] of [[10,10,1,1],[w-10,10,-1,1],[10,h-10,1,-1],[w-10,h-10,-1,-1]]) { line(x,y,x+20*sx,y,'#a9d87877',2); line(x,y,x,y+20*sy,'#a9d87877',2); }
  if (!reducedMotion) { const y = time * 20 % h; const scan = ctx.createLinearGradient(0,y-80,0,y);scan.addColorStop(0,'#b2de7e00');scan.addColorStop(1,'#b2de7e05');ctx.fillStyle=scan;ctx.fillRect(10,y-80,w-20,80); }
}
function drawEnemy(e, time) {
  if (e.warmup > 0) {
    const alpha = .3 + Math.sin(time * 12) * .15;
    const color = e.type === 'chaser' ? '#ffb86c' : '#b99cff';
    ctx.globalAlpha = alpha; circle(e.x, e.y, 30, color, false, 1.5); line(e.x-9,e.y,e.x+9,e.y,color); line(e.x,e.y-9,e.x,e.y+9,color); ctx.globalAlpha = 1; return;
  }
  const color = e.flash > 0 ? '#ffffff' : e.type === 'chaser' ? '#ffb86c' : '#b99cff';
  ctx.shadowColor = color; ctx.shadowBlur = 13;
  if (e.type === 'chaser') {
    const a = Math.atan2(game.player.y - e.y, game.player.x - e.x);
    polygon(e.x,e.y,15,3,a,color,'#38291d'); circle(e.x,e.y,3,color);
  } else if (e.type === 'shooter') {
    polygon(e.x,e.y,21,4,Math.PI/4+Math.sin(time*.6)*.15,color,'#211b30');
    polygon(e.x,e.y,9,4,-Math.PI/4,color,'#b99cff22',1); circle(e.x,e.y,3,color);
  } else {
    polygon(e.x,e.y,25,6,e.angle,color,'#251d35'); circle(e.x,e.y,12,color,false); polygon(e.x,e.y,6,3,-e.angle,color,color);
    for(let i=0;i<6;i++){const a=e.angle+i*Math.PI/3;line(e.x+Math.cos(a)*26,e.y+Math.sin(a)*26,e.x+Math.cos(a)*33,e.y+Math.sin(a)*33,color,2);}
  }
  ctx.shadowBlur = 0;
}
function drawBullet(b) {
  const color = b.prime > 0 ? '#f1ffcf' : '#ff6c9b';
  ctx.shadowColor = color; ctx.shadowBlur = 13;
  circle(b.x,b.y,b.r || 6,color);
  ctx.shadowBlur = 0;
  circle(b.x-1,b.y-1,2,'#ffe2ef');
  if (b.vx || b.vy) { const speed = Math.hypot(b.vx,b.vy); line(b.x-b.vx/speed*10,b.y-b.vy/speed*10,b.x-b.vx/speed*20,b.y-b.vy/speed*20,'#ff6c9b44',2); }
}
function drawPlayer(p, time, attract = false) {
  const invincible = !attract && p.invincible > 0;
  if (invincible && p.dash <= 0 && Math.floor(time * 18) % 2 === 0) ctx.globalAlpha = .55;
  if (invincible) circle(p.x,p.y,24,'#d0fa7244',false,1.5);
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle);
  ctx.shadowColor = '#d0fa72'; ctx.shadowBlur = 18;
  const speed = Math.hypot(p.vx||0,p.vy||0);
  if (speed > 20 || attract) {
    ctx.fillStyle='#d0fa7244';ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(-22-Math.sin(time*30)*5-speed*.018,0);ctx.lineTo(-10,7);ctx.closePath();ctx.fill();
    line(-13,0,-23-Math.sin(time*40)*4,0,'#d0fa72',3);
  }
  ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-12,-12);ctx.lineTo(-7,0);ctx.lineTo(-12,12);ctx.closePath();ctx.fillStyle='#d0fa72';ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#2d4219';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-5,-4);ctx.lineTo(-5,4);ctx.closePath();ctx.fill();ctx.restore();ctx.globalAlpha=1;
}
function drawAttract(time) {
  const w=arena.width,h=arena.height;
  ctx.globalAlpha=.75;
  for(const e of [{x:w*.18,y:h*.18,type:'shooter'},{x:w*.83,y:h*.72,type:'spinner'},{x:w*.19,y:h*.82,type:'chaser'}])drawEnemy({...e,angle:time*.3,warmup:0},time);
  for(let j=0;j<2;j++)for(let i=0;i<6;i++){
    const angle=.4+i*.19,travel=(time*16+j*65)%140;
    drawBullet({x:w*.18+Math.cos(angle)*(40+travel),y:h*.18+Math.sin(angle)*(40+travel),r:5,vx:Math.cos(angle),vy:Math.sin(angle)});
  }
  for(let i=0;i<12;i++){const a=i*Math.PI/6+time*.04;drawBullet({x:w*.83+Math.cos(a)*85,y:h*.72+Math.sin(a)*85,r:5,vx:Math.cos(a),vy:Math.sin(a)});}
  ctx.globalAlpha=1;drawPlayer({x:w*.32+Math.sin(time*.4)*10,y:h*.75,angle:-1.1},time,true);
}

function draw(time) {
  const { dpr, width, height, scale, x, y } = view;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#0c130d';ctx.fillRect(0,0,width,height);
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  ctx.beginPath();ctx.rect(0,0,arena.width,arena.height);ctx.clip();
  if (!reducedMotion && game.state==='playing' && game.shake>0) ctx.translate((Math.random()-.5)*game.shake,(Math.random()-.5)*game.shake);
  drawBackground(time);
  if(game.state==='ready'){drawAttract(time);ctx.restore();return;}
  for(const blast of game.blasts){const progress=blast.age/blast.duration,r=blast.radius*Math.min(1,blast.age/.13);circle(blast.x,blast.y,r,`rgba(208,250,114,${(1-progress)*.13})`);circle(blast.x,blast.y,r,`rgba(208,250,114,${(1-progress)*.8})`,false,2);if(progress<.3)circle(blast.x,blast.y,12*(1-progress/.3),'#f2ffca');}
  for(const e of game.enemies)drawEnemy(e,time);
  for(const b of game.bullets)drawBullet(b);
  ctx.shadowColor='#d0fa72';ctx.shadowBlur=9;
  for(const s of game.shots){const speed=Math.hypot(s.vx,s.vy);line(s.x-s.vx/speed*15,s.y-s.vy/speed*15,s.x,s.y,'#e0ffac',3);}
  ctx.shadowBlur=0;
  for(const p of game.particles){ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}ctx.globalAlpha=1;
  if(game.player.hp>0)drawPlayer(game.player,time);
  for(const label of game.labels){ctx.globalAlpha=Math.min(1,label.life*3);ctx.font=`700 ${label.size}px -apple-system, sans-serif`;ctx.textAlign='center';ctx.fillStyle=label.color;ctx.shadowColor='#0b1409';ctx.shadowBlur=5;ctx.fillText(label.text,label.x,label.y);}ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(pointer.inside && pointer.down && !coarse && game.state==='playing'){
    circle(pointer.x,pointer.y,10,'#d0fa7288',false);line(pointer.x-16,pointer.y,pointer.x-12,pointer.y,'#d0fa72');line(pointer.x+12,pointer.y,pointer.x+16,pointer.y,'#d0fa72');line(pointer.x,pointer.y-16,pointer.x,pointer.y-12,'#d0fa72');line(pointer.x,pointer.y+12,pointer.x,pointer.y+16,'#d0fa72');
  }
  ctx.restore();
}
let hudTimer=0;
function frame(now) {
  const dt = Math.min(.1, lastFrame ? (now-lastFrame)/1000 : 0);lastFrame=now;
  if(game.state!=='paused')visualTime+=dt;
  if(game.state==='playing') {
    accumulator+=dt;
    while(accumulator>=1/120 && game.state==='playing') { game.update(1/120,getInput());dashRequested=false;accumulator-=1/120; }
    handleEvents();
  } else accumulator=0;
  if(toastTimer>0 && game.state==='playing'){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('visible');}
  hudTimer+=dt;if(hudTimer>.06){updateHUD();hudTimer=0;}
  draw(visualTime);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

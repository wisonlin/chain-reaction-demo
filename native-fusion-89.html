<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#243237;background:#f1eee9;font-synthesis:none;--accent:#247a82}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}header,main,footer{max-width:860px;margin:auto;padding-inline:18px}header{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.15em;color:#5a6969;margin:0 0 9px}h1{font-size:28px;font-weight:650;letter-spacing:-.04em;margin:0 0 11px}.intro{font-size:15px;line-height:1.7;color:#4c5c60;margin:0;max-width:600px}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid #cdd4cf;background:#e9efea;border-radius:30px;padding:7px 11px;margin-top:13px;font-size:12px;color:#36584c}.dot{width:6px;height:6px;border-radius:50%;background:#5b8072}.roster{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:7px 0 14px}.hero{min-width:0;border:1px solid transparent;background:transparent;padding:5px 1px;border-radius:14px;min-height:74px}.hero img{display:block;width:46px;height:46px;max-width:100%;margin:auto;object-fit:cover;border-radius:50%;border:2px solid transparent}.hero span{display:block;font-size:12px;line-height:1.3;margin-top:4px}.hero[aria-pressed=true]{background:#fff8;border-color:#ced7ce}.hero[aria-pressed=true] img{border-color:var(--accent)}.switches{display:flex;background:#e3e1db;padding:4px;border-radius:13px;gap:4px;margin:0 0 14px}.switches button{flex:1;min-height:44px;font-size:14px;background:none;border:0;border-radius:9px;white-space:nowrap}.switches button[aria-pressed=true]{background:#fffaf3;box-shadow:0 1px 5px #24323712}.caption{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 10px}.caption h2{font-size:22px;margin:0;font-weight:650}.caption h2 small{font-size:12px;font-weight:500;padding-left:9px;color:var(--accent)}.caption p{font-size:13px;line-height:1.5;margin:5px 0 0;color:#5d6969}.count{font-size:12px;color:#6a7473;white-space:nowrap;padding-bottom:3px;font-variant-numeric:tabular-nums}.art-frame{position:relative;background:#f1eee9;border-radius:18px;overflow:hidden;border:1px solid #d9d9d1;touch-action:pan-y}.art-frame a{display:block;width:100%;aspect-ratio:2/3;max-height:990px}.art-frame img{display:block;width:100%;height:100%;object-fit:contain}.frame-tag{position:absolute;top:12px;left:12px;pointer-events:none;font-size:11px;color:#435456;background:#fff9;backdrop-filter:blur(10px);padding:6px 9px;border-radius:8px}.below-art{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0 17px}.arrows{display:flex;gap:6px}.arrows button{min-width:48px;min-height:44px;border:1px solid #d0d4cc;background:#fff6;border-radius:50%;font-size:20px}a{color:#315e59;text-decoration-thickness:1px;text-underline-offset:3px}.large-link{font-size:13px;min-height:44px;display:flex;align-items:center}.notes{border-top:1px solid #d1d5cd;padding-top:19px;padding-bottom:23px}.notes h3{font-size:16px;margin:0 0 12px}.notes ul{padding-left:19px;margin:0;font-size:14px;line-height:1.85;color:#4e5f60}.references{border-radius:15px;background:#e7e9e1;padding:17px;margin-bottom:23px}.references h3{font-size:14px;margin:0 0 10px}.reference{display:grid;grid-template-columns:1fr;gap:3px;padding:8px 0}.reference a{display:inline-flex;min-height:36px;align-items:center;font-size:14px;word-break:break-word}.reference p{margin:0;color:#5c6b68;font-size:13px;line-height:1.7}.references .hint{font-size:12px;line-height:1.7;color:#5b6964;margin:10px 0 0}footer{border-top:1px solid #d1d5cd;padding-top:18px;padding-bottom:max(28px,env(safe-area-inset-bottom));font-size:12px;line-height:1.8;color:#60706c}footer a{min-height:44px;display:inline-flex;align-items:center}#notice{min-height:20px;font-size:13px;color:#8d4330;margin:0 0 7px}noscript p{padding:20px;font-size:16px} @media(min-width:650px){header,main,footer{padding-inline:30px}header{padding-top:35px}h1{font-size:36px}.roster{gap:12px;margin-top:8px}.hero{min-height:90px}.hero img{width:60px;height:60px}.hero span{font-size:14px}.art-frame{max-width:640px;margin:auto}.caption,.below-art,.switches{max-width:640px;margin-left:auto;margin-right:auto}.notes,.references{max-width:640px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
<header><p class="eyebrow">STAR BORNE / CHARACTER STUDIES</p><h1>六位元素精灵</h1><p class="intro">把精灵的身体特征融进衣装、护甲与武器。六张全身造型，六把配套武器，保留女性人形与裙装。</p><div class="status" id="status"><span class="dot"></span>设定稿预览 · 尚未替换 App</div></header>
<main>
<nav class="roster" aria-label="选择角色" id="roster"></nav>
<div class="switches" role="group" aria-label="查看内容"><button type="button" data-mode="new" aria-pressed="true">融合立绘</button><button type="button" data-mode="weapon" aria-pressed="false">配套武器</button><button type="button" data-mode="old" aria-pressed="false">旧版对比</button></div>
<div class="caption"><div><h2 id="hero-name"></h2><p id="hero-title"></p></div><span class="count" id="count"></span></div>
<p id="notice" aria-live="polite"></p>
<div class="art-frame" id="art-frame"><a id="image-link" target="_blank" rel="noopener" aria-label="打开完整图片"><img id="concept-image" alt="" width="800" height="1200" fetchpriority="high"></a><span class="frame-tag" id="frame-tag">融合设定稿</span></div>
<div class="below-art"><div class="arrows"><button type="button" id="previous" aria-label="上一位角色">←</button><button type="button" id="next" aria-label="下一位角色">→</button></div><a class="large-link" id="large-link" target="_blank" rel="noopener">查看大图 ↗</a></div>
<section class="notes" aria-labelledby="change-title"><h3 id="change-title">这次改了什么</h3><ul id="changes"></ul></section>
<section class="references" aria-labelledby="reference-title"><h3 id="reference-title">造型参考</h3><div id="references"></div><p class="hint">参考链接通往官方图鉴。下列取形说明是本次创作的设计解读；新图由 imagegen 生成。</p></section>
</main>
<footer>这一页展示默认造型与武器设定，不是游戏截图或动画。App 当前仍为 TestFlight 8.8.0（27）。<br><a href="native-fusion-89-prompts.json" target="_blank" rel="noopener">查看生成提示词与参考记录 ↗</a></footer>
<noscript><p>请启用 JavaScript 来切换六位角色。</p></noscript>
<script>
const HEROES=[{"id": "ember", "name": "岚珀", "element": "火", "title": "烬尾祈火师", "color": "#ae482b", "references": [["妖火红狐 Delphox", "https://www.pokemon.com/us/pokedex/delphox", "狐形耳廓与火焰裙摆"], ["沙古牙兽 Sakuyamon", "https://digimon.net/reference_en/detail.php?directory_name=sakuyamon", "仪式装备与法器的整体感"]], "changes": ["银白长发改为暖棕短发，保留成熟的人类面孔。", "火焰扇领与两片尾状裙拖形成整体轮廓。", "法杖采用狐形陶壳与露出的炭火核心。"], "images": {"new": "native-fusion-89-ember-new.webp", "weapon": "native-fusion-89-ember-weapon.webp", "old": "native-fusion-89-ember-old.webp"}, "face": "native-fusion-89-ember-face.webp"}, {"id": "lune", "name": "霁弦", "element": "雷", "title": "雷翼巡猎者", "color": "#7050aa", "references": [["苍炎刃鬼 Ceruledge", "https://www.pokemon.com/us/pokedex/ceruledge", "刃状甲壳与关节分段"], ["妖女兽 LadyDevimon", "https://digimon.net/reference_en/detail.php?directory_name=ladydevimon", "不对称翼膜轮廓"]], "changes": ["红金长发改成黑紫短辫与侧削发。", "硬质甲壳和折叠翼膜构成巡猎者的轮廓。", "月镰改成螳螂前肢般的分节弯刃。"], "images": {"new": "native-fusion-89-lune-new.webp", "weapon": "native-fusion-89-lune-weapon.webp", "old": "native-fusion-89-lune-old.webp"}, "face": "native-fusion-89-lune-face.webp"}, {"id": "nerine", "name": "澜歌", "element": "水", "title": "潮鳍颂唱者", "color": "#247a82", "references": [["沙奈朵 Gardevoir", "https://www.pokemon.com/us/pokedex/gardevoir", "连续流动的裙形外轮廓"], ["天女兽 Angewomon", "https://digimon.net/reference_en/detail.php?directory_name=angewomon", "向下收拢的翼状结构"]], "changes": ["银蓝短发与礼帽改成深青卷发与鳍耳。", "贝壳上衣、鳃领和鳍裙共用流动的形状。", "星仪改成托着水珠的珊瑚环。"], "images": {"new": "native-fusion-89-nerine-new.webp", "weapon": "native-fusion-89-nerine-weapon.webp", "old": "native-fusion-89-nerine-old.webp"}, "face": "native-fusion-89-nerine-face.webp"}, {"id": "sol", "name": "绯穗", "element": "风", "title": "风蝶游剑士", "color": "#478b70", "references": [["裙儿小姐 Lilligant", "https://www.pokemon.com/us/pokedex/lilligant", "花瓣层叠的裙形"], ["风神兽 Shutumon", "https://digimon.net/reference_en/detail.php?directory_name=shutumon", "轻盈翼面与战斗动作"]], "changes": ["深玉色直发改成蓬松栗色卷发。", "蝶翼与花瓣裹裙构成轻快的宽窄对比。", "细剑的护手和剑刃像展开的叶脉。"], "images": {"new": "native-fusion-89-sol-new.webp", "weapon": "native-fusion-89-sol-weapon.webp", "old": "native-fusion-89-sol-old.webp"}, "face": "native-fusion-89-sol-face.webp"}, {"id": "vesper", "name": "夜珩", "element": "冰", "title": "霜月守望者", "color": "#48629b", "references": [["雪妖女 Froslass", "https://www.pokemon.com/us/pokedex/froslass", "雪铃与垂落长袖的形状"], ["狄安娜兽 Dianamon", "https://digimon.net/reference_en/detail.php?directory_name=dianamon", "弯月与冷硬护甲"]], "changes": ["银紫长发改为深靛短发和浅色发梢。", "雪铃裙与偏置月牙护肩形成上下呼应。", "长剑用宽冰晶主刃和月牙护手。"], "images": {"new": "native-fusion-89-vesper-new.webp", "weapon": "native-fusion-89-vesper-weapon.webp", "old": "native-fusion-89-vesper-old.webp"}, "face": "native-fusion-89-vesper-face.webp"}, {"id": "aster", "name": "青翎", "element": "草", "title": "兰瓣织梦师", "color": "#a45089", "references": [["魔幻假面喵 Meowscarada", "https://www.pokemon.com/us/pokedex/meowscarada", "叶片披肩与魔术师的姿态"], ["蔷薇兽 Rosemon", "https://digimon.net/reference_en/detail.php?directory_name=rosemon", "植物融入人形轮廓"]], "changes": ["紫色长发和鹿角改成粉白短发、兰瓣头冠。", "兰花裙与叶片披肩围绕身体自然生长。", "木笛由种荚与叶脉形成，保留清晰吹孔。"], "images": {"new": "native-fusion-89-aster-new.webp", "weapon": "native-fusion-89-aster-weapon.webp", "old": "native-fusion-89-aster-old.webp"}, "face": "native-fusion-89-aster-face.webp"}];
let selected=0,mode='new',start=null,suppressClick=false;
const $=id=>document.getElementById(id);
const labels={new:'融合设定稿',weapon:'配套武器设定稿',old:'旧版立绘素材'};
for(let i=0;i<HEROES.length;i++){const h=HEROES[i],b=document.createElement('button');b.type='button';b.className='hero';b.dataset.hero=h.id;b.setAttribute('aria-label',h.name+' · '+h.element);b.setAttribute('aria-pressed','false');const img=document.createElement('img');img.src=h.face;img.alt='';img.width=160;img.height=160;const span=document.createElement('span');span.textContent=h.name;b.append(img,span);b.addEventListener('click',()=>{selected=i;render()});$('roster').append(b)}
function render(){const h=HEROES[selected];document.documentElement.style.setProperty('--accent',h.color);document.querySelectorAll('.hero').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hero===h.id)));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('hero-name').replaceChildren(document.createTextNode(h.name));const el=document.createElement('small');el.textContent=h.element;$('hero-name').append(el);$('hero-title').textContent=h.title;$('count').textContent=(selected+1)+' / '+HEROES.length;$('notice').textContent='';const path=h.images[mode];$('concept-image').src=path;$('concept-image').alt=h.name+' · '+labels[mode];$('concept-image').dataset.hero=h.id;$('concept-image').dataset.mode=mode;$('image-link').href=path;$('large-link').href=path;$('frame-tag').textContent=labels[mode];$('changes').replaceChildren(...h.changes.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));$('references').replaceChildren(...h.references.map(([name,url,description])=>{const div=document.createElement('div');div.className='reference';const a=document.createElement('a');a.textContent=name+' ↗';a.href=url;a.target='_blank';a.rel='noopener';const p=document.createElement('p');p.textContent=description;div.append(a,p);return div}));}
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>{mode=b.dataset.mode;render()});
function move(delta){selected=(selected+delta+HEROES.length)%HEROES.length;render()}
$('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
$('art-frame').addEventListener('pointerdown',e=>{suppressClick=false;if(e.isPrimary)start={x:e.clientX,y:e.clientY}});
$('art-frame').addEventListener('pointercancel',()=>start=null);
$('art-frame').addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();suppressClick=true;move(dx<0?1:-1)}});
$('image-link').addEventListener('click',e=>{if(suppressClick){e.preventDefault();suppressClick=false}});
$('concept-image').addEventListener('error',()=>{$('notice').textContent='图片加载失败，可重新点选角色重试。'});
render();
</script>
</body></html>

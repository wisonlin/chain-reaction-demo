<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1723">
<title>Starborne · 8.13</title>
<style>
  :root {
    color-scheme: dark;
    background: #0e1723;
    color: #f7ecd6;
    font-family: system-ui, sans-serif;
  }
  body { margin: 0; }
  main { width: min(68rem, calc(100% - 2rem)); margin: 0 auto 3rem; }
  header { padding: 2.1rem 0 1.2rem; }
  h1 { font: 500 clamp(2.4rem, 8vw, 4.25rem)/1 Georgia, serif; margin: 0 0 .8rem; }
  p { color: #c7d5de; line-height: 1.55; margin: .4rem 0; }
  .screens {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17.5rem), 1fr));
    gap: 1.3rem;
  }
  figure { margin: 0; min-width: 0; }
  img { display: block; width: 100%; height: auto; border-radius: .65rem; }
  figure a { display: block; outline-offset: 4px; }
  figcaption { padding-top: .65rem; line-height: 1.45; color: #efcf91; font-weight: 600; }
  @media (min-width: 38rem) { main { padding: 0 .5rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Starborne</h1>
    <p>8.13.0 (32) · iPhone gameplay</p>
    <p>Open Starborne in TestFlight to update.</p>
  </header>
  <section aria-label="Native screenshots" class="screens">
    <figure><a href="native-813-boss.webp" aria-label="Open Boss health at full size"><img src="native-813-boss.webp" width="720" height="1534" alt="Live battle with the Windrest Warden health bar and Pause button" loading="eager"></a><figcaption>Boss health</figcaption></figure>
    <figure><a href="native-813-damage.webp" aria-label="Open Damage beside the traveler at full size"><img src="native-813-damage.webp" width="720" height="1534" alt="A minus fifteen damage number beside Lune" loading="eager"></a><figcaption>Damage beside the traveler</figcaption></figure>
    <figure><a href="native-813-pause.webp" aria-label="Open Boss health while paused at full size"><img src="native-813-pause.webp" width="720" height="1564" alt="Pause menu with the same Warden health bar and Resume and Leave Run buttons" loading="eager"></a><figcaption>Boss health while paused</figcaption></figure>
    <figure><a href="native-813-heroes.webp" aria-label="Open Heroes at full size"><img src="native-813-heroes.webp" width="720" height="1564" alt="Lune holding a crescent scythe in the traveler hall" loading="lazy"></a><figcaption>Heroes</figcaption></figure>
    <figure><a href="native-813-routes.webp" aria-label="Open Routes at full size"><img src="native-813-routes.webp" width="720" height="1564" alt="The Windrest Isles chart with difficulty and route selection" loading="lazy"></a><figcaption>Routes</figcaption></figure>
    <figure><a href="native-813-equipment.webp" aria-label="Open Equipment at full size"><img src="native-813-equipment.webp" width="720" height="1564" alt="Lune&#x27;s scythe and live attack preview" loading="lazy"></a><figcaption>Equipment</figcaption></figure>
    <figure><a href="native-813-recruitment.webp" aria-label="Open Recruitment at full size"><img src="native-813-recruitment.webp" width="720" height="1564" alt="The summoning altar with the Travelers, Weapons and Outfits options" loading="lazy"></a><figcaption>Recruitment</figcaption></figure>
    <figure><a href="native-813-codex.webp" aria-label="Open Codex at full size"><img src="native-813-codex.webp" width="720" height="1564" alt="The enemy catalog showing its element and move filters" loading="lazy"></a><figcaption>Codex</figcaption></figure>
    <figure><a href="native-813-settings.webp" aria-label="Open Settings at full size"><img src="native-813-settings.webp" width="720" height="1564" alt="Controls, sound settings and offline playtest options" loading="lazy"></a><figcaption>Settings</figcaption></figure>
  </section>
</main>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b35"><title>星渡 8.9 · 命中与大招修复</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#102b35;color:#eef4e9}*{box-sizing:border-box}body{margin:0}main{max-width:790px;margin:auto;padding:28px 18px max(32px,env(safe-area-inset-bottom))}h1{font-size:30px;letter-spacing:-.04em;line-height:1.3;margin:10px 0 14px}.meta{font-size:12px;letter-spacing:.12em;color:#b8d3c9}.intro{font-size:16px;line-height:1.8;color:#c8dcd3;margin:0 0 22px}.release{display:inline-block;color:#f7df9d;border:1px solid #758c78;padding:7px 11px;border-radius:9px;font-size:13px}.sound{background:#183c46;border:1px solid #3b5d61;border-radius:18px;padding:18px;margin:20px 0}h2{font-size:20px;margin:0 0 10px}.sound p,figcaption{font-size:14px;line-height:1.8;color:#c3d5ce}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}.play{width:100%;min-height:50px;border:0;border-radius:11px;background:#f2d292;color:#233831;font-weight:650;font-size:17px}audio{width:100%;margin-top:13px;display:block}.roster{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:20px 0 14px}.roster button{min-height:46px;min-width:0;padding:6px 0;background:#1a3c44;border:1px solid #4a6667;color:#d6e3d9;border-radius:9px;font-size:14px}.roster button[aria-pressed=true]{background:#e8dcc1;color:#173c41;border-color:#e8dcc1}.roster small{display:block;font-size:11px;margin-top:3px;opacity:.8}figure{margin:0}.frame{display:flex;align-items:center;justify-content:center;min-height:300px;background:#071c25;border:1px solid #43616b;border-radius:17px;overflow:hidden}.frame a{display:flex;width:100%;justify-content:center}.frame img{display:block;width:100%;max-height:78svh;object-fit:contain}.caption{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 0}.caption h2{margin:0}.caption a{font-size:14px;display:inline-flex;align-items:center;min-height:44px;color:#f2d292}figcaption{margin-top:5px}footer{margin-top:23px;padding-top:15px;border-top:1px solid #49666a;color:#b4ccc3;font-size:12px;line-height:1.8}footer a{color:#e9d398;display:inline-flex;align-items:center;min-height:44px}button:focus-visible,a:focus-visible{outline:3px solid #f2d292;outline-offset:3px}#audio-status{font-size:13px;color:#d8e3d6;min-height:20px;margin:10px 0 0}
@media(max-width:350px){.roster{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main>
<p class="meta">STAR BORNE / NATIVE IOS</p><h1>命中有声音<br>大招恢复原图比例</h1><p class="intro">命中、击杀和破甲音效更突出；命中时音乐短暂避让。大招全身图按素材原比例显示，入场时统一缩放。</p><div class="release">TestFlight 8.9.0（28）· 原内部测试组可更新</div>
<section class="sound"><h2>试听实际打击音效</h2><p>App 内部实际录取的 18 秒战斗音效，含连续命中和两次大招。这里只录入音效，背景音乐没有录入。</p><button class="play" id="play-audio" type="button">试听命中音效 ▶</button><audio id="hit-audio" controls preload="metadata" src="native-89-hit-audio.mp4"></audio><p id="audio-status" aria-live="polite"></p></section>
<nav class="roster" id="roster" aria-label="选择大招截图"></nav><figure><div class="caption"><h2 id="hero-name">霁弦 · 大招实录</h2><a id="open-image" href="native-89-lune.webp" target="_blank" rel="noopener">查看完整截图 ↗</a></div><div class="frame"><a id="image-link" href="native-89-lune.webp" target="_blank" rel="noopener"><img id="cutin-image" width="720" height="1564" src="native-89-lune.webp" alt="霁弦的大招原生截图"></a></div><figcaption>均为同一已测 Release App 的真实模拟器截图，仅等比缩小。人物、首领、弹幕和 HUD 均来自实际游戏画面。</figcaption></figure>
<footer>iPhone / iPad 各 103 项检查通过，另完成 35 场开声音性能采样与六位角色的有限双大招检查。模拟器结果不代表实体设备 GPU 或温控测试。<br><a href="native-89-proof.json" target="_blank" rel="noopener">查看简要验收记录 ↗</a></footer></main>
<script>const HEROES=[{"id": "lune", "name": "霁弦", "element": "雷", "image": "native-89-lune.webp"}, {"id": "ember", "name": "岚珀", "element": "火", "image": "native-89-ember.webp"}, {"id": "nerine", "name": "澜歌", "element": "水", "image": "native-89-nerine.webp"}, {"id": "sol", "name": "绯穗", "element": "风", "image": "native-89-sol.webp"}, {"id": "vesper", "name": "夜珩", "element": "冰", "image": "native-89-vesper.webp"}, {"id": "aster", "name": "青翎", "element": "草", "image": "native-89-aster.webp"}];const audio=document.getElementById('hit-audio'),play=document.getElementById('play-audio');function updatePlay(){play.textContent=audio.paused?'试听命中音效 ▶':'暂停试听 Ⅱ';play.setAttribute('aria-pressed',String(!audio.paused))}play.addEventListener('click',async()=>{try{document.getElementById('audio-status').textContent='';if(audio.paused)await audio.play();else audio.pause();updatePlay()}catch(e){document.getElementById('audio-status').textContent='请再点一次试听，或使用下方播放器。'}});audio.addEventListener('play',updatePlay);audio.addEventListener('pause',updatePlay);audio.addEventListener('ended',updatePlay);for(const h of HEROES){const b=document.createElement('button');b.type='button';b.dataset.hero=h.id;b.setAttribute('aria-label',h.name+' · '+h.element);b.setAttribute('aria-pressed',String(h.id==='lune'));b.append(document.createTextNode(h.name));const s=document.createElement('small');s.textContent=h.element;b.append(s);b.addEventListener('click',()=>{for(const button of document.querySelectorAll('.roster button'))button.setAttribute('aria-pressed',String(button===b));const image=document.getElementById('cutin-image');image.src=h.image;image.alt=h.name+'的大招原生截图';image.dataset.hero=h.id;document.getElementById('hero-name').textContent=h.name+' · 大招实录';document.getElementById('open-image').href=h.image;document.getElementById('image-link').href=h.image});document.getElementById('roster').append(b)}updatePlay();</script></body></html>
